name: p1_gettoastedbread_mvp

shape_meta: &shape_meta
  obs:
    robot0_agentview_right_image:
      shape: [3, 256, 256]
      type: rgb
      lerobot_keys: [video.robot0_agentview_right]
    robot0_agentview_left_image:
      shape: [3, 256, 256]
      type: rgb
      lerobot_keys: [video.robot0_agentview_left]
    robot0_eye_in_hand_image:
      shape: [3, 256, 256]
      type: rgb
      lerobot_keys: [video.robot0_eye_in_hand]
    robot0_base_to_eef_pos:
      shape: [3]
      lerobot_keys: [state.end_effector_position_relative]
    robot0_base_to_eef_quat:
      shape: [4]
      lerobot_keys: [state.end_effector_rotation_relative]
    robot0_gripper_qpos:
      shape: [2]
      lerobot_keys: [state.gripper_qpos]
    lang_emb:
      shape: [768]
  action:
    shape: [12]
    lerobot_keys:
      - action.end_effector_position
      - action.end_effector_rotation
      - action.gripper_close
      - action.base_motion
      - action.control_mode

ckpt_path: /data/sem_bif/checkpoints/robocasa365/diffusion_policy/human300/diffusion_policy/17.40.09_train_diffusion_transformer_hybrid_pretrain_human300/checkpoints/epoch=0500-test_mean_score=-1.000.ckpt
ckpt_state_key: ema_model

source_task: GetToastedBread
split_artifact: ${oc.env:P1_MVP_SPLIT_ARTIFACT,/data/sem_bif/derived/p1_composite_seen_split/split_manifest.json}
split_manifest_sha256: 1ead92ce1b88d0fdd038b57b56b33a16be482d871099a32aad6360fe97ee6f53
annotation_root: /data/sem_bif/derived/annotations/v1/composite_seen/GetToastedBread
cache_root: /data/sem_bif/derived/features/v1_center_random4/composite_seen/GetToastedBread
expected_train_episodes: 450
expected_validation_episodes: 25

# null reconstructs the audited candidate pools directly from annotations.
# P1_MVP_CANDIDATE_ARTIFACT may point at the locked train NPZ for parity runs.
train_candidate_artifact: ${oc.env:P1_MVP_CANDIDATE_ARTIFACT,null}

# All three 50-epoch pilots consume the locked 969-D observation-feature cache.
# Baseline therefore fine-tunes DiT only; its observation encoder stays frozen.
input_path: cached
history_feature_variant: 0

# Exact affine transform used before the frozen Human300 observation encoder
# when v1_center_random4 was generated. Online rollout must reconstruct live
# features with this same transform; the foundation checkpoint normalizer is
# intentionally not part of this contract.
cache_normalizer:
  format_version: linear_normalizer_transform_v1
  transform_sha256: 1bb9ab96a35b00e1aa840fcb642362f1db972d1733dc6d37a29935faac8761b0
  source:
    cache_release: v1_center_random4
    dataset_soup: target_composite_seen
    statistics: merged_metadata
    expected_episode_count: 8000
    expected_frame_count: 5954038
  fields:
    action:
      kind: identity
      size: 12
    lang_emb:
      kind: identity
      size: 768
    robot0_agentview_left_image:
      kind: image_range
    robot0_agentview_right_image:
      kind: image_range
    robot0_eye_in_hand_image:
      kind: image_range
    robot0_base_to_eef_quat:
      kind: identity
      size: 4
    robot0_base_to_eef_pos:
      kind: affine
      scale: [1.4062104225158691, 1.1704314947128296, 1.4565727710723877]
      offset: [-0.2607501149177551, -0.00012028217315673828, -0.5545661449432373]
    robot0_gripper_qpos:
      kind: affine
      scale: [25.115785598754883, 26.718080520629883]
      offset: [-0.4979690909385681, 0.8230366706848145]

base_dataset:
  _target_: diffusion_policy.dataset.lerobot_dataset.LerobotDataset
  shape_meta: *shape_meta
  dataset_path: /data/sem_bif/v1.0/target/composite/GetToastedBread/20250812/lerobot
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${n_obs_steps}
  abs_action: false
  rotation_rep: rotation_6d
  use_legacy_normalizer: false
  use_cache: true
  seed: ${training.seed}
  val_ratio: 0.0
