defaults:
  - _self_
  - task: robocasa/p1_gettoastedbread_mvp

name: p1_baseline_dit_unfreeze
_target_: diffusion_policy.workspace.train_p1_mvp_workspace.TrainP1MVPWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: ${name}

horizon: 10
n_obs_steps: 2
n_action_steps: 8
obs_as_cond: true

policy:
  _target_: diffusion_policy.policy.p1_diffusion_transformer_hybrid_image_policy.P1DiffusionTransformerHybridImagePolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  crop_shape: [224, 224]
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  n_layer: 12
  n_cond_layers: 4
  n_head: 8
  n_emb: 512
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: ${obs_as_cond}

  p1_mode: baseline
  # Exact Mamba selective-SSM reference path already shipped by Transformers.
  # mamba_ssm is an optional fast backend once a CUDA-12.6 compiler is available.
  p1_history_backend: transformers_mamba
  p1_history_model_dim: 128
  p1_history_layers: 2
  p1_latent_dim: 32
  p1_oracle_vocab_size: 6
  p1_oracle_dim: 32
  p1_flow_condition_dim: 64
  p1_jump_condition_dim: 64
  p1_projector_hidden_dim: 256
  p1_dynamics_hidden_dim: 128
  p1_feedback_hidden_dim: 256
  p1_split_layer: 9
  p1_group_windows: 4
  p1_group_stride: 5
  p1_beta_boundary: 0.10
  p1_beta_initialization: 0.10
  p1_beta_overlap_max: 0.05
  p1_teacher_force_until: 0.40
  p1_teacher_force_end: 0.60

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  p1_weight_decay: 1.0e-3
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]

sampling:
  episodes_per_rank: 3
  groups_per_episode: 8
  natural_done_policy: include_terminal

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: false

val_dataloader:
  num_workers: 2
  pin_memory: true
  persistent_workers: false

validation:
  seed: 4242

training:
  seed: 42
  debug: false
  resume: false
  num_epochs: 100
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 250
  max_train_steps: null
  max_grad_norm: 1.0
  use_ema: true
  val_every: 5
  checkpoint_every: 5
  checkpoint_every_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: sem_bif_p1
  mode: offline
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}_seed${training.seed}
  tags:
    - p1
    - ${name}
    - ${task_name}
  id: null
  group: p1_gettoastedbread_mvp
  resume: allow

checkpoint:
  topk:
    monitor_key: val_loss_total
    mode: min
    k: 3
    format_str: epoch={epoch:04d}-val_loss={val_loss_total:.6f}.ckpt

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${oc.env:SEM_BIF_HYDRA_RUN_DIR,data/outputs/p1/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_seed${training.seed}}
  sweep:
    dir: ${oc.env:SEM_BIF_HYDRA_RUN_DIR,data/outputs/p1/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_seed${training.seed}}
    subdir: ${hydra.job.num}
